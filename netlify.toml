# OfficiallySp main site — static publish + reverse proxy to separate Netlify deploys
# Each /appname/* path is served from the matching *.netlify.app site (same naming as repo).
#
# Netlify's "/app/*" pattern does not match "/app/" alone (no splat segment). Without an
# explicit "/app/" → proxy rule, trailing-slash URLs can fall through to Netlify's slash
# handling and 301 to themselves → redirect loop (Chrome -310 ERR_TOO_MANY_REDIRECTS).

[build]
  publish = "."

# --- beedle → https://beedle.netlify.app
[[redirects]]
  from = "/beedle"
  to = "/beedle/"
  status = 301

[[redirects]]
  from = "/beedle/"
  to = "https://beedle.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/beedle/*"
  to = "https://beedle.netlify.app/:splat"
  status = 200
  force = true

