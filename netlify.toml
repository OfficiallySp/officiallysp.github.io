# --- Trailing slash: use _redirects with exact paths only (netlify.toml /path → /path/
# can match /path/ too and causes ERR_TOO_MANY_REDIRECTS / -310).

# Old portfolio path /discompress/* → Discord Tools
[[redirects]]
  from = "/discompress"
  to = "/discordtools/"
  status = 301

[[redirects]]
  from = "/discompress/*"
  to = "/discordtools/:splat"
  status = 301
  force = true

# --- Reverse proxy (200) ---
# Exact "/app/" + "/app/*": Netlify's splat pattern does not match the bare directory path,
# so "/app/" alone must be proxied explicitly (otherwise browsers hit a redirect loop or 404).

[[redirects]]
  from = "/tftmixer/"
  to = "https://tftmixer.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/tftmixer/*"
  to = "https://tftmixer.netlify.app/:splat"
  status = 200
  force = true

