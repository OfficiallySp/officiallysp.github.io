# OfficiallySp main site — reverse proxy to separate Netlify deploys (*.netlify.app).
#
# Do NOT use "from = /app" -> "to = /app/" with status 301. Netlify normalizes
# trailing slashes before matching, so that pair is treated as the same path and
# causes an infinite 301 loop (Chrome -310). See:
# https://docs.netlify.com/manage/routing/redirects/redirect-options/#trailing-slash
#
# Pattern: list /app/* before /app so deep paths use :splat; bare /app and /app/
# both match the final /app rule and proxy to the child site root.

[build]
  publish = "."

# --- beedle
[[redirects]]
  from = "/beedle/*"
  to = "https://beedle.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/beedle"
  to = "https://beedle.netlify.app/"
  status = 200
  force = true

