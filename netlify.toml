# Primary Netlify site for https://officiallysp.net — routes /app-id paths to each app’s Netlify URL.
#
# With Cloudflare in front (orange-cloud DNS): requests still reach Netlify as origin unless you
# intercept them. These redirects run on Netlify after Cloudflare forwards the request.
# If you want a single routing layer: use a Cloudflare Worker (or Snippets) to proxy paths like
# /tftmixer/* to each *.netlify.app origin and keep this file only for the static portfolio—or leave
# routing here and use Cloudflare only for DNS/WAF/cache (simplest).
#
# Cloudflare: disable any Bulk Redirects / Page Rules that send officiallysp.net/<app> to
# <app>.officiallysp.net — that bypasses these proxies and breaks path URLs.
#
# Standalone products on their own apex (e.g. chatstats.live) should not be path-mounted here;
# link directly to those domains from the site.
[build]
  publish = "."

# --- Legacy subdomain → canonical path (301) ---
# Runs when Netlify receives the request on this site (or use child-site _redirects).

[[redirects]]
  from = "https://tftmixer.officiallysp.net/*"
  to = "https://officiallysp.net/tftmixer/:splat"
  status = 301
  force = true

