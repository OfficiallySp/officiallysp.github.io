# --- Reverse proxy (200) ---
# Exact "/app/" + "/app/*": Netlify's splat pattern does not match the bare directory path,
# so "/app/" alone must be proxied explicitly (otherwise browsers hit a redirect loop or 404).

[[redirects]]
  from = "/tftmixer/"
  to = "https://tftmixer.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/tftmixer/*"
  to = "https://tftmixer.netlify.app/:splat"
