# --- discordtools (discompress repo) — targets discompress.netlify.app (the real deploy).
# discordtools.netlify.app is a different unrelated site and will 500 when proxied from here.
[[redirects]]
  from = "/discordtools/*"
  to = "https://discompress.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/discordtools"
  to = "https://discompress.netlify.app/"
  status = 200
  force = true

