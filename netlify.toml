# OfficiallySp main site.
#
# Every project now lives on its own subdomain (<project>.officiallysp.net) and is
# deployed as its own Netlify project. This site is the hub: it hosts the landing
# page, the shared assets under /assets/, and the project detail pages in /pages/.
#
# The rules below exist purely for backwards compatibility. The old scheme served
# projects at officiallysp.net/<project>/ by reverse-proxying the child deploy
# (status = 200). Those proxies are gone; each old path now 301s to the subdomain
# so existing links, bookmarks and search results keep working and search engines
# transfer ranking to the canonical subdomain.
#
# Pattern: list /app/* before /app so deep paths keep their :splat; bare /app and
# /app/ both fall through to the second rule and land on the subdomain root.
#
# Cross-host redirects cannot loop the way same-host trailing-slash pairs do, so
# the /app -> /app/ 301 loop that bit the old proxy config is not a risk here.
# See https://docs.netlify.com/manage/routing/redirects/redirect-options/

[build]
  publish = "."

# --- ascensionsims
[[redirects]]
  from = "/ascensionsims/*"
  to = "https://ascensionsims.officiallysp.net/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/ascensionsims"
  to = "https://ascensionsims.officiallysp.net/"
  status = 301
  force = true

