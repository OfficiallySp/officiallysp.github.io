# Old portfolio path /discompress/* → Discord Tools
[[redirects]]
  from = "/discompress"
  to = "/discordtools/"
  status = 301

[[redirects]]
  from = "/discompress/*"
  to = "/discordtools/:splat"
  status = 301
  force = true

# --- Reverse proxy (200) ---
# /app/ must proxy to the app origin’s root. A local rewrite to /app/index.html 404s here (no file in
# this repo). /app/* covers deep paths; list /app/ explicitly so the bare directory URL works.

[[redirects]]
  from = "/tftmixer/"
  to = "https://tftmixer.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/tftmixer/*"
  to = "https://tftmixer.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tftmixer"
  to = "/tftmixer/"
  status = 301

