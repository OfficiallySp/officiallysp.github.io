<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapDesktop - officiallysp.net</title>
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <script defer src="https://kit.fontawesome.com/8fc60a4d79.js" crossorigin="anonymous"></script>
  <script defer src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1548903334937961" crossorigin="anonymous"></script>
</head>

<body class="flex flex-col min-h-screen">
  <div id="navbar-container"></div>

  <section class="project-header">
    <div class="container">
      <div class="grid md:grid-cols-2 gap-8 items-center">
        <div>
          <h1 class="mb-6">SnapDesktop</h1>
          <p class="text-secondary mb-6">
            A multi-platform app that brings Snapchat web to your desktop. Available for Windows, MacOS and Linux.
          </p>
          <div class="flex gap-4">
            <a href="https://github.com/OfficiallySp/SnapDesktop" class="btn btn-primary">GitHub</a>
            <a href="https://github.com/OfficiallySp/SnapDesktop/releases/tag/2.1" class="btn btn-secondary">Download</a>
          </div>
        </div>
        <div>
          <img src="/assets/img/snap.webp" alt="SnapDesktop" class="img-fluid rounded-lg shadow-lg w-full" />
        </div>
      </div>
    </div>
  </section>

  <section class="project-content">
    <div class="container">
      <h2 class="section-title">Screenshots</h2>
      <div class="screenshots-grid">
        <div class="screenshot-item">
          <img src="/assets/img/snap1.webp" alt="Screenshot 1" />
        </div>
        <div class="screenshot-item">
          <img src="/assets/img/snap2.webp" alt="Screenshot 2" />
        </div>
        <div class="screenshot-item">
          <img src="/assets/img/snap3.webp" alt="Screenshot 3" />
        </div>
      </div>
    </div>
  </section>

  <div id="footer-container"></div>

  <script src="../assets/js/main.js"></script>
  <script>
    ComponentLoader.load("../navbar.html", "navbar-container");
    ComponentLoader.load("../footer.html", "footer-container");
  </script>
</body>
</html>
